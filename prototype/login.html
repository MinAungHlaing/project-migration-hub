{% extends 'base.html' %}{% block title %}{{ t('Login') }} — GTM ERP{% endblock %}
{% block body %}
<div class="card narrow">
  <img class="logo-login" src="/static/logo.png" alt="GTM Distribution">
  <h1>GTM Distribution ERP</h1>
  <form method="post">
    <label>{{ t('Username') }} <input name="username" required autocomplete="username"></label>
    <label>{{ t('Password') }} <input name="password" type="password" required autocomplete="current-password"></label>
    <button class="btn" type="submit">{{ t('Login') }}</button>
  </form>
</div>
{% endblock %}
